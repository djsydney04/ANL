[package]
name = "apl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "APL scalar-core checker and reference evaluator"

[dependencies]
nix = { version = "0.30.1", features = ["fs", "signal", "process"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
