[package]
name = "anl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "ANL checker, reference evaluator, and native compiler"

[dependencies]
nix = { version = "0.30.1", features = ["fs", "signal", "process"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[features]
memory-evidence = []

[[example]]
name = "memory_evidence"
required-features = ["memory-evidence"]
