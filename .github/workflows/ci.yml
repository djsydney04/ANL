name: M1 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compiler:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned compiler toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Install verified solver release
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Darwin/arm64)
              bundle=z3-5.3.3-arm64-osx-13.3
              digest=6957e6c75266d7ca8fa77030e86e83d78624567dcdf34cc11f4192fdc6f93c6b
              ;;
            Darwin/x86_64)
              bundle=z3-5.3.3-x64-osx-13.3
              digest=ace69787d5a21762154b103abe68178188f38e02362fb0f82d346621af90f8e7
              ;;
            Linux/x86_64)
              bundle=z3-5.3.3-x64-glibc-2.39
              digest=d56f60b06f432f33de5810f7f1a384a339131f361e2d54d08ea83eea14326880
              ;;
            *) echo 'Unsupported solver qualification host' >&2; exit 1 ;;
          esac
          mkdir -p .tools
          curl --fail --location --retry 3 \
            "https://github.com/Z3Prover/z3/releases/download/z3-5.3.3/$bundle.zip" \
            --output ".tools/$bundle.zip"
          echo "$digest  .tools/$bundle.zip" | shasum -a 256 --check
          unzip -q ".tools/$bundle.zip" -d .tools
          echo "ANL_TEST_SOLVER=$GITHUB_WORKSPACE/.tools/$bundle/bin/z3" >> "$GITHUB_ENV"
          ".tools/$bundle/bin/z3" -version
      - name: Check formatting
        run: cargo +1.99.1 fmt --all --check
      - name: Check lints
        run: cargo +1.99.1 clippy --locked --all-targets --all-features -- -D warnings
      - name: Test development profile
        run: cargo +1.99.1 test --locked --all-targets
      - name: Test public API doctests
        run: cargo +1.99.1 test --locked --doc
      - name: Test release semantics
        run: cargo +1.99.1 test --locked --release --all-targets
      - name: Test release public API doctests
        run: cargo +1.99.1 test --locked --release --doc
      - name: Check benchmark semantic gate
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'

  formal:
    name: Lean proofs and memory validation / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare validation captures
        run: mkdir -p "$RUNNER_TEMP/anl-memory-ci"
      - name: Install pinned compiler toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install archive utility if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update; sudo apt-get install --yes zstd ;;
              macOS) brew install zstd ;;
              *) echo 'Unsupported archive host' >&2; exit 1 ;;
            esac
          fi
      - name: Install verified Lean release
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64)
              bundle=lean-4.36.0-linux
              digest=2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb
              ;;
            Darwin/arm64)
              bundle=lean-4.36.0-darwin_aarch64
              digest=49acada8749ad1343eff1224a3d2510ac61ed53363d37b5e738e8c587e7deabd
              ;;
            Darwin/x86_64)
              bundle=lean-4.36.0-darwin
              digest=476f9dcf7bee6a070e39a6b15cab7ada48b0086bd91d6e61aa1a454d3da409ce
              ;;
            *) echo 'Unsupported formal qualification host' >&2; exit 1 ;;
          esac
          mkdir -p .tools
          curl --fail --location \
            "https://github.com/leanprover/lean4/releases/download/v4.36.0/$bundle.tar.zst" \
            --output ".tools/$bundle.tar.zst"
          printf '%s  %s\n' "$digest" ".tools/$bundle.tar.zst" \
            | tee "$RUNNER_TEMP/anl-memory-ci/lean-archive.sha256" \
            | shasum -a 256 --check
          zstd --decompress --stdout ".tools/$bundle.tar.zst" | tar -xf - -C .tools
          echo "$GITHUB_WORKSPACE/.tools/$bundle/bin" >> "$GITHUB_PATH"
      - name: Check formal toolchain
        run: |
          lean --version
          test "$(lean --short-version)" = '4.36.0'
          command -v leanchecker
      - name: Pin source inputs for word validation
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          names=subprocess.check_output(['git','ls-files','-z'],cwd=root).split(b'\0')
          rows=[]
          for name in names:
              if not name: continue
              p=root/os.fsdecode(name)
              if p.is_file(): rows.append(dict(path=os.fsdecode(name),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()))
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'anl-memory-ci/word-sources-before.json'
          out.write_text(json.dumps(rows,sort_keys=True,indent=2)+'\n')
          PYTHON
      - name: Check proofs, axioms, and kernel replay
        shell: bash
        run: |
          set -euo pipefail
          formal/check.sh 2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/formal-check.log"
      - name: Build compiler for differential execution
        run: cargo +1.99.1 build --locked
      - name: Compare formal and production evaluators
        shell: bash
        run: |
          set -euo pipefail
          python3 formal/test.py --rust target/debug/anl \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/scalar-comparison.log"
          python3 formal/test_local_state.py --rust target/debug/anl \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/state-comparison.log"
          python3 formal/test_flat_products.py --rust target/debug/anl \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/product-comparison.log"
      - name: Build separate default and evidence memory tools
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 build --locked --release --bin anl --target-dir .tools/memory-default \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/default-build.log"
          cargo +1.99.1 build --locked --release --features memory-evidence \
            --bin anl --example memory_evidence --example mir_validation --target-dir .tools/memory-evidence \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/evidence-build.log"
      - name: Validate memory corpus and boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/memory/run.py audit \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/corpus-audit.log"
          python3 validation/memory/run.py gate \
            --groups static,bridge,pairs,controls,bounds,output-bounds \
            --rust "$GITHUB_WORKSPACE/.tools/memory-default/release/anl" \
            --evidence "$GITHUB_WORKSPACE/.tools/memory-evidence/release/anl" \
            --exporter "$GITHUB_WORKSPACE/.tools/memory-evidence/release/examples/memory_evidence" \
            --pair "$GITHUB_WORKSPACE/formal/.lake/build/bin/anl_memory_pair_checker" \
            --raw "$GITHUB_WORKSPACE/formal/.lake/build/bin/anl_memory_raw_probe" \
            --reference "$GITHUB_WORKSPACE/formal/.lake/build/bin/anl_memory_reference_runner" \
            --cc "$(command -v cc)" \
            --out "$RUNNER_TEMP/anl-memory-ci/corpus" \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/corpus.log"
      - name: Bind word validation tools and build captures
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, shutil
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'anl-memory-ci'
          def identity(path):
              p=pathlib.Path(path).resolve(strict=True)
              return dict(path=str(p),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest())
          sources=json.loads((out/'word-sources-before.json').read_text())
          for row in sources:
              actual=identity(root/row['path'])
              assert actual['bytes']==row['bytes'] and actual['sha256']==row['sha256'], 'source changed during builds: '+row['path']
          manifest=out/'word-build-bindings.json'
          manifest.write_text(json.dumps(dict(sources=sources,logs=[identity(out/p) for p in ['formal-check.log','default-build.log','evidence-build.log']],
              rust_default=['cargo','+1.99.1','build','--locked','--release','--bin','anl','--target-dir','.tools/memory-default'],
              rust_evidence=['cargo','+1.99.1','build','--locked','--release','--features','memory-evidence','--bin','anl','--example','memory_evidence','--example','mir_validation','--target-dir','.tools/memory-evidence'],
              formal=['formal/check.sh'],claim='Source, command recipes, completed build logs and binary identities; no stronger claim than the corresponding build/proof steps.'),sort_keys=True,indent=2)+'\n')
          provenance=dict(path=str(manifest),sha256=identity(manifest)['sha256'])
          roles={'rust':('.tools/memory-default/release/anl','default'),
              'evidence':('.tools/memory-evidence/release/anl','memory-evidence'),
              'exporter':('.tools/memory-evidence/release/examples/memory_evidence','memory-evidence'),
              'rust_mir':('.tools/memory-evidence/release/examples/mir_validation','memory-evidence'),
              'pair':('formal/.lake/build/bin/anl_words_pair_checker','formal'),
              'raw':('formal/.lake/build/bin/anl_words_raw_probe','formal'),
              'reference':('formal/.lake/build/bin/anl_words_reference_runner','formal'),
              'old_scalar':('formal/.lake/build/bin/anl_formal','formal'),
              'old_products':('formal/.lake/build/bin/anl_formal_v2','formal'),
              'old_raw':('formal/.lake/build/bin/anl_memory_raw_probe','formal')}
          tools={k:dict(**identity(root/p),configuration=c,source_manifest=provenance) for k,(p,c) in roles.items()}
          tools['cc']=identity(shutil.which('cc'))
          (out/'word-tools.json').write_text(json.dumps(dict(schema='anl-words-validation-tools-v1',tools=tools),sort_keys=True,indent=2)+'\n')
          PYTHON
      - name: Validate word corpus and boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/words/run.py audit \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/word-audit.log"
          python3 validation/words/run.py gate \
            --tools "$RUNNER_TEMP/anl-memory-ci/word-tools.json" \
            --out "$RUNNER_TEMP/anl-memory-ci/words" \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/word-gate.log"
      - name: Validate boot source and Core admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'anl-memory-ci'
          words=json.loads((out/'word-tools.json').read_text())
          probe=(root/'formal/.lake/build/bin/anl_boot_raw_probe').resolve(strict=True)
          raw=dict(path=str(probe),bytes=probe.stat().st_size,sha256=hashlib.sha256(probe.read_bytes()).hexdigest(),
              configuration='formal',source_manifest=words['tools']['raw']['source_manifest'])
          tools=dict(rust=words['tools']['rust'],evidence=words['tools']['evidence'],raw=raw)
          (out/'boot-tools.json').write_text(json.dumps(dict(schema='anl-boot-validation-tools-v1',tools=tools),sort_keys=True,indent=2)+'\n')
          PYTHON
          python3 validation/boot/run.py audit \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/boot-audit.log"
          python3 validation/boot/run.py gate \
            --tools "$RUNNER_TEMP/anl-memory-ci/boot-tools.json" \
            --out "$RUNNER_TEMP/anl-memory-ci/boot" \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/boot-gate.log"
      - name: Audit recorded memory performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/memory.py audit \
            2>&1 | tee "$RUNNER_TEMP/anl-memory-ci/performance-evidence-audit.log"
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-validation-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anl-memory-ci
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
